name: Clean Old Package Versions

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete old sha versions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const packageName = "rubrol";
              const owner = context.repo.owner;
              console.log(`Checking versions for package: ${packageName} owned by: ${owner}`);
              
              let deletedCount = 0;
              while (true) {
                let versions = [];
                try {
                  const res = await github.request('GET /user/packages/container/{package_name}/versions', {
                    package_name: packageName,
                    per_page: 100
                  });
                  versions = res.data;
                } catch (e1) {
                  const res = await github.request('GET /users/{username}/packages/container/{package_name}/versions', {
                    username: owner,
                    package_name: packageName,
                    per_page: 100
                  });
                  versions = res.data;
                }
                
                const toDelete = versions.filter(v => {
                  const tags = v.metadata?.container?.tags || [];
                  const isGA = tags.includes('GA') || tags.includes('latest');
                  return !isGA;
                });
                
                if (toDelete.length === 0) {
                  console.log(`No more versions to delete! Cleaned up ${deletedCount} versions total.`);
                  break;
                }
                
                console.log(`Found ${toDelete.length} versions to delete in this batch`);
                for (const v of toDelete) {
                  const tags = v.metadata?.container?.tags || [];
                  try {
                    await github.request('DELETE /user/packages/container/{package_name}/versions/{version_id}', {
                      package_name: packageName,
                      version_id: v.id
                    });
                    deletedCount++;
                    console.log(`[${deletedCount}] Deleted version ${v.id} (tags: ${tags.join(',')})`);
                  } catch (delErr) {
                    console.error(`Error deleting version ${v.id}:`, delErr.message);
                  }
                }
              }
            } catch (err) {
              console.error("Workflow failed:", err.message);
              throw err;
            }
