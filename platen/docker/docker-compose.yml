services:
  platen-pdf-engine:
    build:
      context: ../..
      dockerfile: platen/docker/Dockerfile
    container_name: platen-sidecar
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
        reservations:
          memory: 32M
